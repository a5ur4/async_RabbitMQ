services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: sd-rabbitmq
    hostname: sd-rabbitmq   # hostname fixo: o RabbitMQ guarda os dados por nome de no
    ports:
      - "5672:5672"     # AMQP (producer/consumer)
      - "15672:15672"   # painel web: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rabbitmq_data:
